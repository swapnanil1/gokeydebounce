name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting, vet, tests, and build
        run: make check
      - name: Race detector
        run: go test -race ./...
      - name: Cross-build Linux ARM64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o bin/keydebounce-arm64 ./cmd/keydebounce
      - name: Fuzz debounce state transitions
        if: matrix.go == 'stable'
        run: go test ./internal/debounce -fuzz=FuzzFilterPairing -fuzztime=10s -parallel=2
